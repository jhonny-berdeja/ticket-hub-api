name: Publish ticket-hub-api image

on:
  push:
    branches: [master]

concurrency:
  group: publish-ticket-hub-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push ticket-hub-api image to Docker Hub.
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image_tag.outputs.tag }}
    steps:
      - name: Clone the repository to access the code and scripts.
        uses: actions/checkout@v4

      - name: Save BRANCH_NAME to GITHUB_ENV file.
        run: echo "BRANCH_NAME=${{ github.ref_name }}" >> "$GITHUB_ENV"

      - name: Save sanitized branch name to GITHUB_ENV.
        run: |
          BRANCH_NAME_SANITIZED="$(echo "$BRANCH_NAME" | sed -E 's/[^a-zA-Z0-9._-]/-/g')"
          echo "BRANCH_NAME_SANITIZED=$BRANCH_NAME_SANITIZED" >> "$GITHUB_ENV"

      - name: Save tag value to GITHUB_OUTPUT file.
        id: image_tag
        run: echo "tag=$BRANCH_NAME_SANITIZED" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub.
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ticket-hub-api image to Docker Hub.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ticket-hub-api:${{ steps.image_tag.outputs.tag }}

  dispatch-deploy:
    name: "Approve: infra-hub will deploy ticket-hub-api to pcbox microk8s."
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Enable workflow_dispatch in infra-hub to deploy the ticket-hub-api image.
        env:
          GH_TOKEN: ${{ secrets.INFRA_HUB_DISPATCH_TOKEN }}
        run: |
          gh workflow run deploy-ticket-hub-api.yml \
            --repo "${{ github.repository_owner }}/infra-hub" \
            --ref master \
            -f image_tag="${{ needs.build-and-push.outputs.image_tag }}"

      - name: Link to the deploy in infra-hub
        run: |
          {
            echo "## 🚀 Deploy aprobado y disparado hacia infra-hub"
            echo ""
            echo "Este run pusheó \`${{ secrets.DOCKERHUB_USERNAME }}/ticket-hub-api:${{ needs.build-and-push.outputs.image_tag }}\` y, una vez aprobado arriba, le avisó a \`infra-hub\` que despliegue esa imagen en el cluster microk8s de pcbox. infra-hub la aplica automáticamente - no hace falta otra aprobación ahí."
            echo ""
            echo "**[▶ Ver el run de deploy en infra-hub](https://github.com/${{ github.repository_owner }}/infra-hub/actions/workflows/deploy-ticket-hub-api.yml)**"
          } >> "$GITHUB_STEP_SUMMARY"
