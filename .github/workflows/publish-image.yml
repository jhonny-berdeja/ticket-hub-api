name: Publish ticket-hub-api image

on:
  push:
    branches: [master]

concurrency:
  group: publish-ticket-hub-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-dispatch:
    name: Build, push and dispatch deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine image tag
        id: image_tag
        # Branch-name tag (design ADR-2). Only `master` can trigger this
        # workflow, so the tag is always `master` in practice; the
        # sanitization below is defensive future-proofing, not a live
        # fix, in case the trigger surface is ever broadened.
        run: |
          RAW="${{ github.ref_name }}"
          SAFE="$(echo "$RAW" | sed -E 's/[^a-zA-Z0-9._-]/-/g')"
          echo "tag=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ticket-hub-api:${{ steps.image_tag.outputs.tag }}

      - name: Dispatch deploy to infra-hub
        # Least-privilege bridge (design ADR-3): the PAT behind
        # INFRA_HUB_DISPATCH_TOKEN is scoped to `actions: write` only on
        # infra-hub. It cannot commit, open a PR, or alter any infra-hub
        # file — it can only start the run that infra-hub gates behind
        # its own `production` Environment approval.
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_HUB_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/infra-hub
          event-type: deploy-ticket-hub-api
          client-payload: '{"image_tag": "${{ steps.image_tag.outputs.tag }}"}'
