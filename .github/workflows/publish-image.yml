name: Publish ticket-hub-api image

on:
  push:
    branches: [master]

concurrency:
  group: publish-ticket-hub-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-dispatch:
    name: Build, push and dispatch deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine image tag
        id: image_tag
        # Branch-name tag (design ADR-2). Only `master` can trigger this
        # workflow, so the tag is always `master` in practice; the
        # sanitization below is defensive future-proofing, not a live
        # fix, in case the trigger surface is ever broadened.
        run: |
          RAW="${{ github.ref_name }}"
          SAFE="$(echo "$RAW" | sed -E 's/[^a-zA-Z0-9._-]/-/g')"
          echo "tag=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ticket-hub-api:${{ steps.image_tag.outputs.tag }}

      - name: Trigger deploy in infra-hub
        # Least-privilege bridge (design ADR-3): the PAT behind
        # INFRA_HUB_DISPATCH_TOKEN is scoped to `actions: write` only on
        # infra-hub. It cannot commit, open a PR, or alter any infra-hub
        # file — it can only start the run that infra-hub gates behind
        # its own `production` Environment approval.
        #
        # Uses `workflow_dispatch` via the GitHub CLI instead of
        # `repository_dispatch`: per GitHub's REST API docs, the
        # `POST /repos/{owner}/{repo}/dispatches` endpoint (used by
        # repository_dispatch) requires `contents: write` on a
        # fine-grained PAT, while `POST .../actions/workflows/{id}/dispatches`
        # (workflow_dispatch) requires only `actions: write` — the scope
        # this design actually promises. infra-hub's
        # deploy-ticket-hub-api.yml already listens for workflow_dispatch
        # with an `image_tag` input, so no change was needed on that side.
        env:
          GH_TOKEN: ${{ secrets.INFRA_HUB_DISPATCH_TOKEN }}
        run: |
          gh workflow run deploy-ticket-hub-api.yml \
            --repo "${{ github.repository_owner }}/infra-hub" \
            --ref master \
            -f image_tag="${{ steps.image_tag.outputs.tag }}"

      - name: Link to the deploy in infra-hub
        # GitHub Actions has no embeddable "button" inside a run page -
        # the only real interactive control is the environment's native
        # "Review deployments" approval button, which lives on infra-hub's
        # side. This step writes a Job Summary (rendered at the bottom of
        # this run's page) explaining that and linking straight to it.
        run: |
          {
            echo "## 🚀 Deploy triggered in infra-hub"
            echo ""
            echo "This run pushed \`${{ secrets.DOCKERHUB_USERNAME }}/ticket-hub-api:${{ steps.image_tag.outputs.tag }}\` and told \`infra-hub\` to deploy it to the pcbox microk8s cluster."
            echo ""
            echo "If the \`production\` environment in \`infra-hub\` has required reviewers configured, that deploy run is now **waiting for approval** - open the link below, open the run, and click **Review deployments → Approve and deploy** to let it proceed. If no reviewers are configured yet, it already ran automatically."
            echo ""
            echo "**[▶ Open the infra-hub deploy workflow](https://github.com/${{ github.repository_owner }}/infra-hub/actions/workflows/deploy-ticket-hub-api.yml)**"
          } >> "$GITHUB_STEP_SUMMARY"
