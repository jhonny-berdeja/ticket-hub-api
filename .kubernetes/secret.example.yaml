# Copy this file to secret.yaml, replace the placeholder below with a real
# random value, then `microk8s kubectl apply -f .kubernetes/secret.yaml`.
# NEVER commit secret.yaml — it's gitignored on purpose (same pattern as
# .env.example -> .env at the root of this repo).
#
# Generate a value: openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: ticket-hub-api-credentials
  namespace: ticket-hub
type: Opaque
stringData:
  JWT_SECRET: replace-with-a-real-random-secret
